<ion-header>
  <ion-toolbar color="dark" style="--background: #1a1a1a; --color: #fff;">
    <ion-title class="text-white text-center font-bold">
      Favoris
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-black" style="--background: #000;">
  <!-- Section toutes les voitures -->
  <div class="p-4 bg-black">
    <div class="grid grid-cols-2 gap-4">
      <div
        *ngFor="let car of allCars"
        class="bg-gray-800 rounded-lg overflow-hidden relative"
      >
        <!-- Car Image -->
        <div class="relative">
          <img [src]="car.image" [alt]="car.name" class="w-full h-32 object-cover">
          <!-- Heart icon for removing from favorites -->
          <div class="absolute top-2 right-2" (click)="toggleFavorite(car)">
            <ion-icon
              [name]="car.isFavorite ? 'heart' : 'heart-outline'"
              class="text-red-500 text-2xl"
            ></ion-icon>
          </div>
        </div>

        <!-- Car Details -->
        <div class="p-3">
          <h3 class="text-white text-sm font-semibold mb-1">{{ car.name }}</h3>
          <p class="text-orange-500 font-bold text-sm mb-2">{{ car.price.toLocaleString() }} CFA / Jour</p>

          <!-- Reserve Button -->
          <button
            class="w-full bg-orange-500 text-white text-xs font-bold py-2 px-3 rounded mb-2 hover:bg-orange-600 transition-colors"
            (click)="onCarClick(car)"
          >
            Réserver
          </button>
        </div>
      </div>
    </div>

   
  </div>
</ion-content>
